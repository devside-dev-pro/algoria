<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Marque ALGORIA — triangle "A" cyan→bleu roi traversé par la flèche de tendance (vectorisation du logo officiel). -->
  <defs>
    <linearGradient id="tri" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#25e0f7"/>
      <stop offset="0.45" stop-color="#19c8f2"/>
      <stop offset="0.72" stop-color="#2e7bf0"/>
      <stop offset="1" stop-color="#1e40e5"/>
    </linearGradient>
    <linearGradient id="arw" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2e8bf0"/>
      <stop offset="1" stop-color="#4fc7f8"/>
    </linearGradient>
    <!-- masque : la flèche "découpe" le triangle (liseré transparent autour de son tracé) -->
    <mask id="cut">
      <rect width="512" height="512" fill="white"/>
      <polyline points="118,352 232,246 274,296 388,178" fill="none" stroke="black" stroke-width="64" stroke-linejoin="miter"/>
    </mask>
  </defs>
  <!-- triangle "A" (encoche au centre bas, comme le logo) -->
  <path d="M256 58 L452 434 H346 L256 252 L166 434 H60 Z" fill="url(#tri)" mask="url(#cut)"/>
  <!-- flèche de tendance -->
  <polyline points="118,352 232,246 274,296 380,186" fill="none" stroke="url(#arw)" stroke-width="34"/>
  <polygon points="342,150 428,138 414,222" fill="#4fc7f8"/>
</svg>
